name: Test cargo-deny list command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-deny list command on fixture crate
        id: action
        uses: .
        with:
          command: list
          arguments: ""
          command-arguments: ""
          manifest-path: ./tests/fixtures/test-crate/Cargo.toml
          log-level: warn

      - name: Assert list command completed successfully
        run: |
          echo "PASS: cargo-deny list command completed without error"
