name: Test full check with all features
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-deny full check (all checks)
        id: action
        uses: .
        with:
          command: check
          arguments: ""
          command-arguments: "all"
          manifest-path: ./tests/fixtures/simple-crate/Cargo.toml
          log-level: warn

      - name: Assert action succeeded
        run: |
          echo "cargo-deny full check completed successfully"
          echo "PASS"
