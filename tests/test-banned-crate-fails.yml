name: Test banned crate makes check fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Positive control: the same dependency set passes when not banned
      - id: control
        uses: .
        with:
          command: check
          command-arguments: bans
          manifest-path: test/Cargo.toml
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: check
          command-arguments: bans
          manifest-path: tests/fixtures/banned/Cargo.toml
      - name: Assert control passed and banned check failed
        env:
          CONTROL: ${{ steps.control.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "control: $CONTROL"
          echo "outcome: $OUTCOME"
          if [ "$CONTROL" != "success" ]; then
            echo "FAIL: control check should have succeeded"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected bans check to fail on banned lazy_static"
            exit 1
          fi
          echo "PASS"
