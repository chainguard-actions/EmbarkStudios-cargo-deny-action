name: Test cargo-deny with custom log level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          manifest-path: ./tests/fixtures/test-crate/Cargo.toml
          arguments: ""
          command: check
          command-arguments: licenses
          log-level: info
      - name: Assert action succeeded with info log level
        run: |
          echo "PASS: cargo-deny check licenses with info log level completed successfully"
