name: Test cargo-deny log-level input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/basic" "$GITHUB_WORKSPACE/test-project"

      - id: action
        uses: .
        with:
          command: list
          arguments: ""
          command-arguments: ""
          manifest-path: "./test-project/Cargo.toml"
          log-level: "info"

      - name: Assert action succeeded with info log level
        run: |
          echo "PASS: cargo-deny list with info log level completed successfully"
