name: Test cargo-deny bans check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-deny bans check on fixture crate
        id: action
        uses: .
        with:
          command: check
          arguments: ""
          command-arguments: "bans"
          manifest-path: ./tests/fixtures/test-crate/Cargo.toml
          log-level: warn

      - name: Assert bans check passed
        run: |
          echo "PASS: cargo-deny bans check completed without error"
