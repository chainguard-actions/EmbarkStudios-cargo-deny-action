name: Test list command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert test crate exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test/Cargo.toml" ]; then
            echo "FAIL: test/Cargo.toml missing"
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        with:
          command: list
          arguments: ""
          manifest-path: test/Cargo.toml
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
