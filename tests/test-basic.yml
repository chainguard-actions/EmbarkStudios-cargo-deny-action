name: Test basic cargo-deny check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/basic" "$GITHUB_WORKSPACE/test-project"

      - id: action
        uses: .
        with:
          command: check
          arguments: ""
          command-arguments: "licenses"
          manifest-path: "./test-project/Cargo.toml"
          log-level: "warn"

      - name: Assert action succeeded
        run: |
          echo "PASS: cargo-deny check licenses completed successfully"
